# Registro histórico da avaliação Balemuni Aurora iniciada na v4.2
#
# ESTE ARQUIVO NÃO É CARREGADO PELO DRIVER.
#
# A implementação distribuída está somente nos patches versionados. Este
# registro existe para impedir que valores estudados sejam confundidos com
# opções ativas ou copiados novamente sem revisão.

# [ir3]
# gcm=1
# Implementado em patches/0005-a740-aurora-performance.patch com gate por
# capacidade: reg_size_vec4 >= 96. O override GCM=0/1 continua disponível para
# diagnóstico. Não é um gate exclusivo da A740.

# [suballocator]
# pipeline_block_kb=512
# kgsl_profiling_block_kb=512
# Implementado no patch 0005 para as famílias suportadas. A alocação permanece
# preguiçosa e o limite não força consumo permanente do bloco inteiro.

# [shader_cache]
# size_gb=4
# Rejeitado. Um limite maior não elimina a compilação inicial e não demonstrou
# redução reproduzível de stutter que justificasse o custo de armazenamento.

# [compatibility.emulator]
# Regras amplas por engine foram removidas na v4.5 porque atingiam todos os
# jogos do emulador e ampliavam a superfície de regressão. O patch
# 0006-emulator-compat-driconf.patch mantém somente BOTW/TOTK isolados pelo nome
# do aplicativo, sem forçar TU_DEBUG=gmem ou TU_DEBUG=sysmem.
