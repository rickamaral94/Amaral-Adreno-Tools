# Amaral Turnip — registro de intencao da afinacao vinda do Aurora
#
# ATENCAO: ESTE ARQUIVO NAO E' LIDO POR NADA.
#
# Nenhum script de build, workflow ou o proprio driver consultam este
# diretorio. E' registro do que se pretendeu, nao configuracao ativa. A fonte
# da verdade sao os patches e as notas em docs/releases/.
#
# Atualizado na v4.3. O nome do diretorio ("a740") ficou historico: a analise
# da v4.3 mostrou que quase nada disto e' especifico da A740.

# [ir3]
# gcm=1                       v4.2: so a7xx+ (gen >= 7)
#                             v4.3: ENTREGUE onde reg_size_vec4 >= 96, o que
#                             cobre a7xx inteira, a8xx, a6xx_gen1 e a6xx_gen2.
#                             Fora: a6xx_gen3/gen4 (64) e a6xx_gen1_low (48/32),
#                             onde o passe tende a virar spill.
#                             Override: GCM=1 / GCM=0 em qualquer familia.

# [suballocator]
# pipeline_block_kb=512       v4.2: so a7xx+.  v4.3: ENTREGUE em TODAS as
# kgsl_profiling_block_kb=512 familias. Alocacao preguicosa, no maximo dois BOs
#                             por suballocador, pior caso ~1,5 MiB.

# [shader_cache]
# size_gb=4                   NAO ENTREGUE, e nao entregavel hoje, em nenhuma
#                             familia. O Mesa desliga o cache em disco no
#                             Android: src/util/disk_cache_os.c,
#                             disk_cache_enabled(), "#if defined(
#                             SHADER_CACHE_DISABLE_BY_DEFAULT) ||
#                             DETECT_OS_ANDROID -> disable_by_default = true".
#                             Ligar exige a propriedade
#                             mesa.shader.cache.disable=false, que nao se define
#                             sem root, e um diretorio gravavel que o processo
#                             nao tem. Qualquer limite de tamanho e' inerte
#                             enquanto isso valer.

# [compatibility.emulador]
# tu_dont_care_as_load=true            v4.3: ENTREGUE, patches/0006
# tu_allow_oob_indirect_ubo_loads=true v4.3: ENTREGUE, patches/0006
# tu_emulate_alpha_to_coverage=true    v4.3: ENTREGUE, patches/0006 (acrescimo
#                                      nosso, por analogia com DXVK/vkd3d)
#                             Casam <engine engine_name_match="yuzu Emulator">.
#                             Alcance universal: nenhuma das tres tem teste de
#                             geracao no fonte do Turnip. Valem para a6xx, a7xx
#                             e a8xx.
