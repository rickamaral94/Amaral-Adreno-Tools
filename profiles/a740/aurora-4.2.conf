# Amaral Turnip 4.2 — A740, registro de intencao
#
# ATENCAO: ESTE ARQUIVO NAO E' LIDO POR NADA.
#
# Nenhum script de build, workflow ou o proprio driver consultam este
# diretorio. Ele e' registro do que se pretendeu, nao configuracao ativa.
# Foi mantido porque a versao anterior o publicou sugerindo que as chaves
# abaixo estavam ligadas - o que nao era verdade em nenhuma delas.
#
# Coluna "estado" diz o que a v4.2 realmente entrega.

# [ir3]
# gcm=1                       estado: ENTREGUE, via patches/0005, so no a7xx+
#                             override por ambiente: GCM=0 desliga

# [suballocator]
# pipeline_block_kb=512       estado: ENTREGUE, via patches/0005, so no a7xx+
# kgsl_profiling_block_kb=512 estado: ENTREGUE, via patches/0005, so no a7xx+

# [shader_cache]
# size_gb=4                   estado: NAO ENTREGUE, e nao entregavel hoje.
#                             O Mesa desliga o cache em disco no Android:
#                             src/util/disk_cache_os.c, disk_cache_enabled(),
#                             "#if defined(SHADER_CACHE_DISABLE_BY_DEFAULT)
#                              || DETECT_OS_ANDROID -> disable_by_default = true".
#                             Ligar exige a propriedade mesa.shader.cache.disable
#                             =false, que nao se define sem root, e um diretorio
#                             gravavel que o processo nao tem. Qualquer limite de
#                             tamanho e' inerte enquanto isso valer.

# [compatibility.zelda]
# tu_dont_care_as_load=true          estado: NAO ENTREGUE
# tu_allow_oob_indirect_ubo_loads=true  estado: NAO ENTREGUE
#                             As duas opcoes existem no Turnip, em
#                             src/freedreno/vulkan/00-turnip-defaults.conf, mas
#                             o upstream as aplica a Kex Engine, Clausewitz,
#                             DXVK e a jogos nomeados - nunca a Zelda e nunca a
#                             emulador. Nao ha entrada de Zelda no upstream.
#                             Liga-las para o emulador inteiro custa desempenho
#                             em todos os jogos dele (as duas desativam
#                             otimizacao), e nao ha medicao que justifique.
#                             Fica de fora ate haver corrida no aparelho.
