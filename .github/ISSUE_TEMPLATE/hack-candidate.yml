name: Candidato de patch/hack
description: Proponha uma mudança comunitária com fonte e evidência.
title: "[Candidate] "
body:
  - type: input
    id: source
    attributes:
      label: Fonte original, commit/patch exato e licença
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: O que muda e por que deve funcionar
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: GPUs, emuladores e jogos afetados
    validations:
      required: true
  - type: textarea
    id: isolation
    attributes:
      label: Gate, isolamento e reversão
      description: Explique se depende de chip, capacidade, família ou aplicativo e como desativar sem atingir os demais.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Resultados A/B, rodadas, visuais, estabilidade e logs
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Riscos conhecidos e casos de controle
      description: Liste regressões possíveis, GPUs/emuladores ainda não testados e o baseline usado.
    validations:
      required: true
