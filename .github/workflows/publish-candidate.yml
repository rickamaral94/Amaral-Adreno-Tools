name: Publish Amaral change as pre-release

on:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "build-aux/**"
      - "requirements-build.txt"
      - "scripts/build_universal.sh"
      - "scripts/check_reproducibility.sh"
      - "scripts/validate_artifact.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amaral-release
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: main

      - id: recovery
        name: Detect interrupted candidate publication
        run: |
          pending="$(mktemp)"
          python3 tools/release_version.py resume candidate --github-output "${pending}"
          if grep -Fxq 'resume_available=true' "${pending}"; then
            tag="$(sed -n 's/^release_tag=//p' "${pending}")"
            standard="$(sed -n 's/^standard_file=//p' "${pending}")"
            oneui="$(sed -n 's/^oneui_file=//p' "${pending}")"
            status="$(python3 tools/publish_release.py status --tag "${tag}" \
              --source-sha "$(git rev-parse HEAD)" --standard "${standard}" \
              --oneui "${oneui}")"
            if [ "${status}" = incomplete ]; then
              version="$(sed -n 's/^version=//p' "${pending}")"
              source_sha="$(git log -1 --format=%H --fixed-strings \
                --grep="candidate: registra revisão Amaral v${version}")"
              test -n "${source_sha}"
              git checkout --detach "${source_sha}"
              python3 tools/release_version.py resume candidate
              echo 'resume=true' >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Fetch pinned Mesa
        run: |
          commit="$(python3 -c 'import json; print(json.load(open("config/mesa-lock.json"))["mesa"]["commit"])')"
          git init -q work/mesa-version
          git -C work/mesa-version fetch -q --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git "${commit}"
          git -C work/mesa-version checkout -q --detach FETCH_HEAD

      - id: release
        name: Resolve candidate version
        run: |
          if [ "${{ steps.recovery.outputs.resume }}" = true ]; then
            python3 tools/release_version.py resume candidate --github-output "${GITHUB_OUTPUT}"
            echo 'candidate_available=true' >> "${GITHUB_OUTPUT}"
          else
            python3 tools/release_version.py candidate \
              --mesa-src work/mesa-version \
              --github-output "${GITHUB_OUTPUT}" \
              --write
          fi

      - name: Validate candidate metadata
        if: steps.release.outputs.candidate_available == 'true'
        run: |
          python3 tools/validate_project.py
          bash -n scripts/*.sh

      - name: Install build dependencies
        if: steps.release.outputs.candidate_available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential file flex glslang-tools pkg-config python3-venv unzip zip
          python3 -m venv work/venv
          work/venv/bin/pip install --requirement requirements-build.txt
          echo "${GITHUB_WORKSPACE}/work/venv/bin" >> "${GITHUB_PATH}"
          mkdir -p work/toolchains
          curl --fail --location --output work/android-ndk-r29-linux.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          echo "87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b  work/android-ndk-r29-linux.zip" | sha1sum --check
          unzip -q work/android-ndk-r29-linux.zip -d work/toolchains

      - name: Build Standard twice
        if: steps.release.outputs.candidate_available == 'true'
        env:
          NDK_ROOT: ${{ github.workspace }}/work/toolchains/android-ndk-r29
          DRIVER_VARIANT: standard
        run: ./scripts/check_reproducibility.sh

      - name: Build OneUI twice
        if: steps.release.outputs.candidate_available == 'true'
        env:
          NDK_ROOT: ${{ github.workspace }}/work/toolchains/android-ndk-r29
          DRIVER_VARIANT: oneui
        run: ./scripts/check_reproducibility.sh

      - name: Prepare checksums
        if: steps.release.outputs.candidate_available == 'true'
        env:
          STANDARD_FILE: ${{ steps.release.outputs.standard_file }}
          ONEUI_FILE: ${{ steps.release.outputs.oneui_file }}
        run: |
          unzip -t "dist/${STANDARD_FILE}"
          unzip -t "dist/${ONEUI_FILE}"
          grep -Fq "reproducible=true" dist/REPRODUCIBILITY_standard.txt
          grep -Fq "reproducible=true" dist/REPRODUCIBILITY_oneui.txt
          (cd dist && sha256sum "${STANDARD_FILE}" "${ONEUI_FILE}" > SHA256SUMS.txt)

      - name: Persist tested candidate source
        if: steps.release.outputs.candidate_available == 'true'
        env:
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "${{ steps.recovery.outputs.resume }}" != true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/mesa-lock.json config/version-state.json "${NOTES_FILE}"
            git commit -m "candidate: registra revisão Amaral v${VERSION}"
            git push origin HEAD:main
          fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git cat-file -e "HEAD:${NOTES_FILE}"
          python3 tools/validate_project.py

      - name: Publish verified pre-release for A/B
        if: steps.release.outputs.candidate_available == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          STANDARD_FILE: ${{ steps.release.outputs.standard_file }}
          ONEUI_FILE: ${{ steps.release.outputs.oneui_file }}
        run: |
          python3 tools/publish_release.py publish \
            --tag "${RELEASE_TAG}" --source-sha "$(git rev-parse HEAD)" \
            --standard "${STANDARD_FILE}" --oneui "${ONEUI_FILE}" \
            --title "${RELEASE_TITLE}" --notes-file "${NOTES_FILE}" \
            --channel candidate
