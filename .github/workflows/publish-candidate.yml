name: Publish verified candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amaral-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      pending: ${{ steps.candidate.outputs.pending }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: candidate
        run: |
          python3 tools/validate_project.py
          python3 - <<'PY'
          import json, os
          state = json.load(open('config/version-state.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('pending=' + str(bool(state.get('candidate'))).lower() + '\n')
          PY
  build:
    needs: preflight
    if: needs.preflight.outputs.pending == 'true'
    uses: ./.github/workflows/build-candidate.yml
  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-*
          merge-multiple: true
          path: dist
      - name: Verify exact source and both variants before pre-release
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          python3 tools/verify_release_bundle.py dist
          python3 tools/release_version.py resume candidate --github-output "$RUNNER_TEMP/release"
          (cd dist && sha256sum turnip_amaral_*.zip > SHA256SUMS.txt)
      - name: Publish pre-release only; preserve Latest
        run: |
          previous_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          value() { sed -n "s/^$1=//p" "$RUNNER_TEMP/release"; }
          python3 tools/publish_release.py publish \
            --tag "$(value release_tag)" --source-sha "$(git rev-parse HEAD)" \
            --standard "$(value standard_file)" --oneui "$(value oneui_file)" \
            --title "$(value release_title)" --notes-file "$(value notes_file)" --channel candidate
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$previous_latest"
