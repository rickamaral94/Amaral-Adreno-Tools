name: Fortnightly Mesa control review
on:
  schedule:
    # 07:07 BRT on days 1 and 16. No build merely because Mesa moved.
    - cron: '7 10 1,16 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amaral-release
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Compare official Mesa with locked control
        run: |
          base="$(python3 -c 'import json; print(json.load(open("config/mesa-lock.json"))["mesa"]["commit"])')"
          git init -q work/mesa
          git -C work/mesa fetch --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git main
          git -C work/mesa checkout --detach FETCH_HEAD
          git -C work/mesa fetch --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git "$base"
          python3 tools/review_upstream.py work/mesa
      - name: Persist control evidence without changing driver or release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/upstream-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'control: record fortnightly Mesa triage'
            git push origin HEAD:main
          fi
