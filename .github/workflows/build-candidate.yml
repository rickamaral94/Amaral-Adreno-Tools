name: Reproducible universal build
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-twice:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, oneui]
    env:
      DRIVER_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Project gates before expensive builds
        run: |
          python3 tools/validate_project.py
          python3 -m unittest discover -s tests -v
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Cache verified NDK archive only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/downloads/android-ndk-r29-linux.zip
          key: ndk-r29-linux-87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b
      - name: Install and record build environment
        run: bash scripts/setup_build.sh
      - name: Build twice from independent source and output directories
        env:
          NDK_ROOT: ${{ github.workspace }}/work/toolchains/android-ndk-r29
        run: bash scripts/check_reproducibility.sh
      - name: Upload verified variant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-${{ matrix.variant }}
          path: |
            dist/turnip_amaral_*.zip
            dist/REPRODUCIBILITY_*.txt
            dist/BUILD_MANIFEST_*.json
            dist/BUILD_ENVIRONMENT_*.txt
            dist/GPU_CATALOG_*.h
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-${{ matrix.variant }}
          path: work/reproducibility/${{ matrix.variant }}/*/build.log
          if-no-files-found: ignore
          retention-days: 30
