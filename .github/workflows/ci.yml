name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 tools/validate_project.py
          python3 -m unittest discover -s tests -v
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Apply exact patch manifest against official pinned Mesa
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("config/mesa-lock.json"))["mesa"]["commit"])')"
          git init -q work/mesa
          git -C work/mesa fetch --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git "$sha"
          git -C work/mesa checkout --detach FETCH_HEAD
          python3 tools/apply_patches.py work/mesa --variant standard
          python3 tools/check_a840_topology.py work/mesa
          python3 tools/check_vulkan_roadmap.py work/mesa --fail-on-new-support
          git -C work/mesa apply --check "$GITHUB_WORKSPACE/patches/0003-oneui-ubwc.patch"
