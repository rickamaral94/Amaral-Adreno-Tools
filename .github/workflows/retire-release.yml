name: Aposentar uma release

# Marca uma release como substituida: reescreve o corpo a partir de
# docs/releases/<tag>.md e a rebaixa para pre-lancamento, tirando o rotulo
# "latest" se ela o tiver.
#
# O publicador atual nunca reconstroi tags historicas. Este workflow generico
# permite atualizar o estado de qualquer release antiga de forma explicita.
#
# NAO apaga nada: a release, os anexos e a tag continuam. So deixam de ser a
# recomendada.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release a aposentar (ex.: mesa-26.3.0-devel-v4.2)'
        required: true

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Conferir que a release e as notas existem
        run: |
          set -euo pipefail
          test -f "docs/releases/${TAG}.md" \
            || { echo "notas ausentes: docs/releases/${TAG}.md" >&2; exit 1; }
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null \
            || { echo "release inexistente: ${TAG}" >&2; exit 1; }
          grep -qi "substitu" "docs/releases/${TAG}.md" \
            || { echo "as notas de ${TAG} nao dizem que ela foi substituida" >&2; exit 1; }

      - name: Rebaixar a release
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --notes-file "docs/releases/${TAG}.md" \
            --prerelease --latest=false
          echo "--- estado final ---"
          # isLatest nao existe em "gh release view --json" - o rotulo "Latest"
          # e' propriedade do repositorio, nao da release. Perguntar por ele ali
          # fazia o passo falhar DEPOIS de a edicao ja ter dado certo, e uma
          # operacao bem-sucedida se reportava como falha.
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isPrerelease,isDraft
          echo "--- qual release o repositorio serve como Latest agora ---"
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name \
            || echo "(nenhuma marcada como Latest)"
