name: Promote A/B-approved candidate

on:
  workflow_dispatch:
    inputs:
      confirm_ab_approved:
        description: "Confirm that the candidate passed the required A/B tests"
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: amaral-release
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.confirm_ab_approved == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: candidate
        run: python3 tools/release_version.py promote --github-output "${GITHUB_OUTPUT}"
      - name: Prepare stable metadata
        run: python3 tools/release_version.py promote --write
      - name: Promote the exact tested release
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          mesa_version="$(python3 -c 'import json; print(json.load(open("config/mesa-lock.json"))["mesa"]["version"])')"
          tag="mesa-${mesa_version}-v${VERSION}"
          notes_file="docs/releases/${tag}.md"
          gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --title "Turnip Amaral ${mesa_version} v${VERSION}" \
            --notes-file "${notes_file}" --prerelease=false --latest
      - name: Record stable patch set
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mesa_version="$(python3 -c 'import json; print(json.load(open("config/mesa-lock.json"))["mesa"]["version"])')"
          git add config/version-state.json "docs/releases/mesa-${mesa_version}-v${VERSION}.md"
          git commit -m "release: promove v${VERSION} como estável"
          git push origin HEAD:main
