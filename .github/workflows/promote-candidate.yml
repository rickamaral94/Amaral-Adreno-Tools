name: Promote hardware-qualified candidate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amaral-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate qualification before any mutation
        run: |
          python3 tools/release_version.py promote --github-output "$RUNNER_TEMP/promotion"
          python3 tools/release_version.py resume candidate --github-output "$RUNNER_TEMP/release"
          tag="$(sed -n 's/^release_tag=//p' "$RUNNER_TEMP/release")"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist
          python3 tools/verify_release_bundle.py dist --source-sha "$(git rev-list -n1 "$tag")" --qualification
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Promote the tested binaries and record state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag="$(sed -n 's/^release_tag=//p' "$RUNNER_TEMP/release")"
          notes="$(sed -n 's/^notes_file=//p' "$RUNNER_TEMP/release")"
          python3 tools/release_version.py promote --write
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --notes-file "$notes"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$tag"
          git add config/version-state.json "$notes"
          git commit -m "release: record qualified promotion $tag"
          git push origin HEAD:main
